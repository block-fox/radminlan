pluginManagement {
    repositories {
        maven { url = uri(rootDir.toString() + '/local-maven') }
        maven { url = uri(rootDir.toString() + '/.gradle/loom-cache/minecraftMaven') }
        maven { url = uri(System.getProperty('user.home') + '/.gradle/caches/fabric-loom/minecraftMaven') }
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

def officialMojangRuntime = providers.gradleProperty('minecraft_version').getOrElse('') == '26.2'

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven {
            url = uri(rootDir.toString() + '/local-maven')
            // These development copies can have the same coordinates as
            // Mojang's libraries while exposing an older API. Let Loom use
            // the official dependencies for the 26.2 runtime instead.
            content {
                if (officialMojangRuntime) excludeGroup 'com.mojang'
            }
        }
        maven { url = uri(rootDir.toString() + '/.gradle/loom-cache/minecraftMaven') }
        maven { url = uri(System.getProperty('user.home') + '/.gradle/caches/fabric-loom/minecraftMaven') }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = 'https://maven.terraformersmc.com/releases' }
        mavenCentral()
    }
}

rootProject.name = 'radminlan'
